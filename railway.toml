[services.frontend]
buildCommand = "cd lyrics-app && npm run build"
startCommand = "cd lyrics-app && npm start"
healthcheckPath = "/"
sourceDir = "lyrics-app"

[services.api]
buildCommand = "cd api && npm install"
startCommand = "cd api && npm start"
healthcheckPath = "/health"
sourceDir = "api"

# Environment variables for the API service
[services.api.envVars]
OPENAI_API_KEY = "your_openai_api_key_here"

# Environment variables for the frontend service
[services.frontend.envVars]
VITE_API_BASE_URL = "https://myscribbles-api.up.railway.app"
